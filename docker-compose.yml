services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poechallenges
      POSTGRES_USER: poe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poe -d poechallenges"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

volumes:
  pgdata:
