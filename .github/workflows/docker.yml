name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the cluster pulls, since this repo has no Flux
          # image automation. The sha tag exists so a rollback has something
          # concrete to point at.
          tags: |
            ghcr.io/saturate/poechallenges:latest
            ghcr.io/saturate/poechallenges:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
