name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A real build timestamp. repository.updated_at is the repo's own mtime,
      # which is not when this image was built. The epoch form goes in the tag,
      # since Flux's ImagePolicy needs something sortable and a SHA is not.
      - id: stamp
        run: |
          echo "built=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # main-<sha>-<epoch> is what Flux image automation tracks: the epoch
          # sorts, the sha says which commit. :latest and the bare sha tag stay
          # for anything pulling by hand and for rollbacks.
          tags: |
            ghcr.io/saturate/poechallenges:latest
            ghcr.io/saturate/poechallenges:${{ github.sha }}
            ghcr.io/saturate/poechallenges:main-${{ github.sha }}-${{ steps.stamp.outputs.epoch }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The package is public, so a .dockerignore regression would publish
      # .env to the world the moment this job finishes. Fail the build first.
      - name: Fail if an env file got baked into the image
        run: |
          docker create --name check ghcr.io/saturate/poechallenges:${{ github.sha }}
          if docker export check | tar -t | grep -E '(^|/)\.env'; then
            echo "::error::env file present in image layers"
            exit 1
          fi
          echo "no env files in image layers"
